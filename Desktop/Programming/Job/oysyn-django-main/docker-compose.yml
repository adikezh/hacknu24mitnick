version: "3.9"

networks:
  oysyn_network:

services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - oysyn_network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 5s
      retries: 5
      timeout: 5s

  redis:
    build:
      context: .
      dockerfile: Dockerfile.redis
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - oysyn_network

  web:
    build: .
    container_name: django_web
    restart: always
    depends_on:
      db:
        condition: service_healthy  # Ensures Django waits for PostgreSQL
      redis:
        condition: service_started
      elasticsearch:
        condition: service_started
    env_file:
      - .env
    command: >
      sh -c "until pg_isready -h db -U ${POSTGRES_USER} -d ${POSTGRES_DB}; do sleep 3; done &&
         python manage.py makemigrations &&
         python manage.py migrate &&
         python manage.py collectstatic --noinput &&
         gunicorn core.wsgi:application --bind 0.0.0.0:8000"    
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    networks:
      - oysyn_network  # Attach service to network

  celery:
    build: .
    container_name: django_celery
    restart: always
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
      redis:
        condition: service_started
    env_file:
      - .env
    command: celery -A core worker --loglevel=info
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    networks:
      - oysyn_network

  flower:
    build: .
    container_name: django_flower
    restart: always
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
      celery:
        condition: service_started
      redis:
        condition: service_started
    env_file:
      - .env
    command: celery -A core flower --port=5555
    ports:
      - "5555:5555"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    networks:
      - oysyn_network

  nginx:
    image: nginx:1.21.6
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./django_nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web
    networks:
      - oysyn_network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ELASTIC_USERNAME=elastic
      - ELASTIC_PASSWORD=changeme
      - xpack.security.enabled=true
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - oysyn_network

volumes:
  postgres_data:
  static_volume:
  media_volume:
  esdata:
