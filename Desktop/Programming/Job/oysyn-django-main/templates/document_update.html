{% extends "_base.html" %}

{% load static %}
{% load i18n %}
{% load crispy_forms_tags %}

{% block title %}{% trans 'Update document info' %}{% endblock title %}

{% block content %}
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col col-md-6">
      <h2>{% trans 'Update document' %}</h2>
      <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <input class="btn btn-success w-100" type="submit" value="{% trans 'Change' %}">
      </form>
    </div>
  </div>
</div>
{% endblock %}
