{% extends '_base.html' %}

{% load static %}
{% load i18n %}
{% load crispy_forms_tags %}

{% block title %}Загрузить документ{% endblock title %}

{% block content %}
<style>
  #div_id_ocr_languages {
    display: none;
  }
</style>

<div class="container" style="margin-top: 120px; margin-bottom: 120px;">
  <div class="row mt-5">
    <div class="col">
      <h1>{% trans 'Upload new document' %}</h1>
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form|crispy }}
        
        

        <input class="btn btn-success mt-3" type="submit" value="{% trans 'Upload' %}">
      </form>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const ocrToggle = document.getElementById('id_include_ocr');
    const ocrLanguagesDiv = document.getElementById('div_id_ocr_languages');
    
    ocrToggle.addEventListener('change', function () {
      ocrLanguagesDiv.style.display = this.checked ? 'block' : 'none';
    });
  });
</script>
{% endblock content %}
