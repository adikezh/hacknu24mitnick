{% extends '_base.html' %}

{% load crispy_forms_tags %}
{% load i18n %}

{% block title %}{% trans 'Sign Up' %}{% endblock title %}

{% block content %}

<div class="container" style="margin-top: 120px; margin-bottom: 120px;">
  <div class="row justify-content-center">
    <div class="col col-md-6">
      <h2>{% trans 'Sign Up' %}</h2>
      <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button class="btn btn-success w-100" type="submit">{% trans 'Send' %}</button>
      </form>
    </div>
  </div>
</div>
{% endblock content %}
