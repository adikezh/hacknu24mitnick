{% extends '_base.html' %}

{% load static %}
{% load i18n %}
{% load crispy_forms_tags %}

{% block title %}{{ object.title}}{% endblock title %}

{% block content %}
<div class="container mt-5 mb-5">
  <div class="row">
    <div class="col">
      <form action="">
        {% csrf_token %}
        {{ form|crispy }}
        <button class="btn btn-success" type="submit">Submit</button>
      </form>
    </div>
  </div>
</div>
{% endblock content %}
